{% extends "base.html" %}
{% load static %}

{% block body_class %}template-courspage{% endblock %}

{% block content %}



<img class="page-image" src="{% static 'images/banniere-cours.svg' %}" alt="Un cours collectif en action">

<div class="content">
    <h1>Nos cours</h1>

    <ul class="cours-list">
        {% for cours in cours_list %}
        <li class="cours-card">
            <h3>{{cours.nom}}</h3>
            <p>{{cours.horaire}}. {{cours.niveau}}.</p>
            <p>{{cours.description}}</p>
        </li>
        {% endfor %}
    </ul>
</div>

{% endblock content %}
